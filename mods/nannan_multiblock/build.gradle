plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = '0.1.0'
group = 'nannan.dev.multiblocks'
base {
    archivesName = 'nannan_multiblock'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                nannan_multiblock {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                nannan_multiblock {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Mekanism'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'

    implementation(fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')) {
        transitive = false
    }
    compileOnly(fg.deobf('mezz.jei:jei-1.20.1-forge:15.48.0.179')) {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
